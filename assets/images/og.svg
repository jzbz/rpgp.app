<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for og.png. Rendered with:

    XDG_DATA_HOME=<dir holding fonts/geo.ttf> \
      rsvg-convert -w 1200 -h 630 og.svg -o og.png

  Colours are the dark-theme tokens from the app's theme.slint, so the card,
  the site and the application all read as one product. The certificates are
  the throwaway ones from the repository's seed-demo-store example.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- A little depth behind the lockup, well under the text contrast. -->
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#6f8dff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6f8dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel">
      <rect x="680" y="132" width="440" height="366" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#131519"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ──────────────────────────────────────────────────────────── lockup -->
  <g transform="translate(80 84) scale(1.8333)" fill="none" stroke="#6f8dff"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
  </g>
  <text x="142" y="124" font-family="Geo" font-size="54" fill="#e8eaef">rPGP</text>

  <!-- ────────────────────────────────────────────────────────── headline -->
  <g font-family="Noto Sans, sans-serif" font-weight="700" font-size="56"
     fill="#e8eaef" letter-spacing="-1.4">
    <text x="80" y="238">Your certificates,</text>
    <text x="80" y="302">in a window.</text>
  </g>

  <g font-family="Noto Sans, sans-serif" font-size="23" fill="#99a1b0">
    <text x="80" y="358">An OpenPGP certificate manager</text>
    <text x="80" y="390">for Linux and macOS.</text>
  </g>

  <text x="80" y="452" font-family="Source Code Pro, monospace" font-size="18"
        fill="#6b7385">no webview · no Qt · no C++ · no gpg subprocess</text>

  <text x="80" y="524" font-family="Source Code Pro, monospace" font-size="22"
        fill="#6f8dff">rpgp.app</text>

  <!-- ─────────────────────────────────────────────────────── the window -->
  <g clip-path="url(#panel)">
    <rect x="680" y="132" width="440" height="366" fill="#1a1d23"/>

    <!-- title strip -->
    <rect x="680" y="132" width="440" height="34" fill="#16181d"/>
    <circle cx="700" cy="149" r="5" fill="#363c47"/>
    <circle cx="716" cy="149" r="5" fill="#363c47"/>
    <circle cx="732" cy="149" r="5" fill="#363c47"/>
    <text x="900" y="153" font-family="Noto Sans, sans-serif" font-size="12"
          fill="#6b7385" text-anchor="middle">rPGP</text>
    <rect x="680" y="165" width="440" height="1" fill="#272b33"/>

    <!-- selected row -->
    <rect x="680" y="166" width="440" height="76" fill="#6f8dff" fill-opacity="0.14"/>
    <rect x="680" y="166" width="3" height="76" fill="#6f8dff"/>

    <!-- rows -->
    <g font-family="Noto Sans, sans-serif">
      <!-- Ada -->
      <circle cx="719" cy="204" r="19" fill="#6f8dff" fill-opacity="0.15"/>
      <text x="719" y="209" font-size="14" font-weight="700" fill="#6f8dff" text-anchor="middle">AL</text>
      <text x="752" y="199" font-size="17" fill="#e8eaef">Ada Lovelace</text>
      <text x="752" y="219" font-size="13" fill="#99a1b0">ada@analytical.engine</text>
      <rect x="1024" y="194" width="76" height="20" rx="10" fill="#4ed6a1" fill-opacity="0.12"/>
      <text x="1062" y="208" font-size="11" font-weight="600" fill="#4ed6a1" text-anchor="middle">verified</text>

      <!-- Grace -->
      <circle cx="719" cy="280" r="19" fill="#4ed6a1" fill-opacity="0.15"/>
      <text x="719" y="285" font-size="14" font-weight="700" fill="#4ed6a1" text-anchor="middle">GH</text>
      <text x="752" y="275" font-size="17" fill="#e8eaef">Grace Hopper</text>
      <text x="752" y="295" font-size="13" fill="#99a1b0">grace@navy.mil</text>
      <rect x="1024" y="270" width="76" height="20" rx="10" fill="#4ed6a1" fill-opacity="0.12"/>
      <text x="1062" y="284" font-size="11" font-weight="600" fill="#4ed6a1" text-anchor="middle">verified</text>

      <!-- Alan -->
      <circle cx="719" cy="356" r="19" fill="#f0b264" fill-opacity="0.15"/>
      <text x="719" y="361" font-size="14" font-weight="700" fill="#f0b264" text-anchor="middle">AT</text>
      <text x="752" y="351" font-size="17" fill="#e8eaef">Alan Turing</text>
      <text x="752" y="371" font-size="13" fill="#99a1b0">alan@bletchley.uk</text>
      <rect x="1024" y="346" width="76" height="20" rx="10" fill="#4ed6a1" fill-opacity="0.12"/>
      <text x="1062" y="360" font-size="11" font-weight="600" fill="#4ed6a1" text-anchor="middle">verified</text>

      <!-- Radia -->
      <circle cx="719" cy="432" r="19" fill="#56c2d6" fill-opacity="0.15"/>
      <text x="719" y="437" font-size="14" font-weight="700" fill="#56c2d6" text-anchor="middle">RP</text>
      <text x="752" y="427" font-size="17" fill="#e8eaef">Radia Perlman</text>
      <text x="752" y="447" font-size="13" fill="#99a1b0">radia@spanning.tree</text>
      <rect x="988" y="422" width="112" height="20" rx="10" fill="#f0b264" fill-opacity="0.12"/>
      <text x="1044" y="436" font-size="11" font-weight="600" fill="#f0b264" text-anchor="middle">partly verified</text>
    </g>

    <!-- status bar -->
    <rect x="680" y="470" width="440" height="28" fill="#16181d"/>
    <rect x="680" y="470" width="440" height="1" fill="#272b33"/>
    <text x="700" y="489" font-family="Noto Sans, sans-serif" font-size="12"
          fill="#99a1b0">7 certificate(s), 2 with a secret key</text>
  </g>
  <rect x="680.5" y="132.5" width="439" height="365" rx="14" fill="none" stroke="#272b33"/>
</svg>
